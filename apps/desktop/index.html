<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The tab icon is `public/aether.svg`, a byte-for-byte copy of the mark master
      at packages/ui/brand/aether-mark.svg; the window/taskbar icons in
      src-tauri/icons are rasterised from that same master (`npm run tauri icon --
      ../../packages/ui/brand/aether-mark.svg`). One geometry, three media - see
      the master for the two `d` strings that define it.
    -->
    <link rel="icon" type="image/svg+xml" href="/aether.svg" />
    <meta name="theme-color" content="#07090b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether Next</title>
    <!-- Fonts are bundled by Vite from @fontsource-variable (imported in
         src/App.tsx). No remote stylesheet: a circumvention tool must not make a
         third-party request from its UI before the tunnel exists. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
