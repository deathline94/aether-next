[package]
name = "aether-desktop"
version = "1.3.12"
description = "Aether Next desktop application"
authors = ["deathline94"]
edition = "2021"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aether_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
zeroize = "1"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # `CreateFileW` with a read-only share mode: the single open the binary-trust
  # witness in `trust.rs` reads through. `std`'s `OpenOptionsExt::share_mode` cannot
  # express it — std unions the requested bits with READ|WRITE|DELETE.
  "Win32_Storage_FileSystem",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


# The engine (aether/Cargo.toml) has shipped with `strip = true, lto = "fat",
# codegen-units = 1` for a long time; this crate had no `[profile.release]` at all,
# so the binary that actually sits on the customer's desktop - the one with the
# tray, the IPC surface and the paths into `%APPDATA%` - kept its full symbol
# table while the thing it spawns did not. The GUI is the more interesting
# reverse-engineering target of the two, which makes the mismatch backwards.
#
# `panic = "unwind"` is stated rather than inherited: the engine's unwind is
# load-bearing (its `catch_unwind` netstack containment), and here it is what the
# shell's own `tests/` and the Tauri runtime expect. Writing it down means a future
# `panic = "abort"` size-optimisation cannot be applied to one half of the product
# and silently change how a crash looks to a user.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
