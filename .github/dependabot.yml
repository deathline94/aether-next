version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      root-npm:
        dependency-type: development
    ignore:
      # Runtime deps stay individually reviewable; only dev tooling is grouped.
      - dependency-name: react
      - dependency-name: react-dom

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      desktop:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      android-web:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /aether
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Pinned to a pre-release by design (see aether/Cargo.toml). Changing it is
      # a deliberate, reviewed act, not a routine bump.
      - dependency-name: x25519-dalek

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Gradle: the Android shell's dependency graph (AGP, Kotlin, androidx, the
  # Tauri-generated WebView glue) was invisible to Dependabot - `gradle` is a
  # supported ecosystem and `apps/android/android` is a normal Gradle root with a
  # settings.gradle, so the only reason it was missing is that nobody added it.
  - package-ecosystem: gradle
    directory: /apps/android/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      android-gradle:
        patterns:
          - "*"

  # NOT COVERABLE, on purpose and not an oversight: the vendored `quiche/` tree.
  # Dependabot's cargo ecosystem needs a committed lockfile in the directory it is
  # pointed at, and `quiche/` is a workspace with no `quiche/Cargo.lock` - it is
  # resolved through `aether/Cargo.lock` as a path dependency. So:
  #   * a `package-ecosystem: cargo / directory: /quiche` entry would be rejected
  #     ("does not contain a Cargo.lock file"), and
  #   * Dependabot would not see the hand-applied patches either way, because it
  #     compares crates.io versions while `quiche/` is a *source* copy whose real
  #     base is the upstream commit recorded in quiche/PATCHES.md, not the `0.29.2`
  #     its manifest declares.
  # The vendor copy is instead gated by scripts/verify-quiche-vendor.mjs (ci.yml's
  # supply-chain job), which turns any drift from that recorded provenance red.
