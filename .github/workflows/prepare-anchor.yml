name: Prepare engine witness

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to prepare a release engine'
        required: true
        default: ''
      ref:
        description: 'Commit SHA, version tag, or main to build'
        required: true
        default: 'main'

permissions:
  contents: read

concurrency:
  group: prepare-anchor
  cancel-in-progress: false

jobs:
  cut:
    name: Build and witness the engine
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate request
        shell: pwsh
        env:
          CONFIRM: ${{ inputs.confirm }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if ($env:CONFIRM -ne 'PUBLISH') { throw 'confirm must be PUBLISH' }
          if ($env:INPUT_REF -notmatch '^(?:[0-9a-f]{40}|main|v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$') {
            throw 'ref must be main, a full commit SHA, or a version tag'
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: lukka/get-cmake@5f6e04f5267c8133f1273bf2103583fc72c46b17 # v3.31.5
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Build engine
        working-directory: aether
        env:
          CMAKE_GENERATOR: Ninja
        run: cargo build --release
      - name: Record the engine digest and build artifact
        shell: pwsh
        run: |
          $exe = 'aether/target/release/aether.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'engine build is missing' }
          node scripts/publish-engine-trust.mjs --name aether.exe --file $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/anchor-witness.mjs --name aether.exe --run "$env:GITHUB_RUN_ID" --artifact engine-witness --profile unsigned-witnessed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/publish-engine-trust.mjs --check --name aether.exe --file $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/anchor-witness.mjs --check --name aether.exe --run "$env:GITHUB_RUN_ID" --artifact engine-witness --profile unsigned-witnessed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload witnessed engine
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: engine-witness
          path: aether/target/release/aether.exe
          if-no-files-found: error
          retention-days: 365
      - name: Open witness pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          $branch = "anchor/$(git rev-parse --short HEAD)-$([Guid]::NewGuid().ToString('N').Substring(0,8))"
          git config user.name 'deathline94'
          git config user.email 'deathline94@users.noreply.github.com'
          git checkout -b $branch
          git add packaging/trust/engine-trust.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'engine witness did not change' }
          git commit -m "Record engine digest from run $env:GITHUB_RUN_ID"
          gh auth setup-git
          git push -u origin $branch
          if ($LASTEXITCODE -ne 0) { throw 'could not push the witness branch' }
          gh pr create --base $env:BASE --title 'Record engine build for release' --body "Engine: unsigned. SHA-256 and artifact pointer were measured in workflow run $env:GITHUB_RUN_ID. Merge before tagging a release."
