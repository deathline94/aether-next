name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The mechanical cross-cutting invariants (BC-03/04/05/09/10/11/14/20). These
  # are cheap, whole-repo checks that no per-crate test would ever notice:
  # a kill-switch reappearing in `tls.rs`, a `lock().unwrap()` on the shell
  # lifecycle path, or a className with no rule behind it.
  invariants:
    name: Invariant gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
      - name: Every gate must pass
        run: node scripts/verify-invariants.mjs
      - name: Every gate must be able to fail
        # Guards against a gate that reports green because it stopped looking.
        run: node scripts/verify-invariants.mjs --selftest-fail

  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - uses: lukka/get-cmake@5f6e04f5267c8133f1273bf2103583fc72c46b17 # v3.31.5
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - run: cargo check --manifest-path aether/Cargo.toml
      - run: cargo clippy --manifest-path aether/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path aether/Cargo.toml

  desktop-ui:
    name: Desktop UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  desktop-backend:
    name: Desktop backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  android-ui:
    name: Android UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - run: npm ci
      - run: npm run build

  android-native-payloads:
    name: Android native payload gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require ABI libraries when present in tree
        run: |
          set -euo pipefail
          # If any ABI dir exists, every advertised ABI must have both libs.
          root="apps/android/android/app/src/main/jniLibs"
          if [[ ! -d "$root" ]]; then
            echo "jniLibs absent (CI release workflow builds them)"
            exit 0
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libaether.so libhev-socks5-tunnel.so; do
              f="$root/$abi/$lib"
              if [[ -e "$f" ]]; then
                test -s "$f"
              fi
            done
          done

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon
