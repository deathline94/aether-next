# Builds real installable apps on every push to main (and on tags / manual run).
# Downloads: Actions → run → Artifacts, or the "Latest" GitHub Release (updated every main push).
name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One build per branch/tag. A new push cancels the older in-flight job (not a real failure).
concurrency:
  group: build-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

jobs:
  test:
    name: Automated test gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: lukka/get-cmake@5f6e04f5267c8133f1273bf2103583fc72c46b17 # v3.31.5
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Run engine tests
        working-directory: aether
        # --release avoids debug CRT mismatch with BoringSSL on VS 18 2026 runners.
        run: cargo test --release
        env:
          CMAKE_GENERATOR: Ninja
      - name: Run desktop backend tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --tests
      - name: Run desktop frontend tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm test
      - name: Run android frontend tests
        working-directory: apps/android
        run: |
          npm ci
          npm test
      - name: Run android unit tests
        working-directory: apps/android/android
        run: ./gradlew testDebugUnitTest

  windows-app:
    name: Windows x64
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.22"
          cache: false
      - uses: lukka/get-cmake@5f6e04f5267c8133f1273bf2103583fc72c46b17 # v3.31.5
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Create ephemeral CI code signing certificate
        shell: pwsh
        timeout-minutes: 2
        run: |
          $pfxPass = "ci-sign-$([Guid]::NewGuid().ToString('N').Substring(0,16))"
          $configPath = Join-Path $env:RUNNER_TEMP "aether-codesign.cnf"
          $keyPath = Join-Path $env:RUNNER_TEMP "aether-codesign.key"
          $certPath = Join-Path $env:RUNNER_TEMP "aether-codesign.crt"
          $pfxPath = Join-Path $env:RUNNER_TEMP "aether-codesign.pfx"
          "[req]`ndefault_bits = 2048`ndistinguished_name = req_dn`nx509_extensions = v3_cs`nprompt = no`n[req_dn]`nCN = deathline94`n[v3_cs]`nkeyUsage = critical,digitalSignature`nextendedKeyUsage = codeSigning`nbasicConstraints = critical,CA:FALSE`nsubjectKeyIdentifier = hash" |
            Set-Content -LiteralPath $configPath -NoNewline

          & openssl req -x509 -newkey rsa:2048 -keyout $keyPath -out $certPath -days 1825 -nodes -config $configPath 2>&1
          if ($LASTEXITCODE -ne 0) { throw "openssl req failed with exit code $LASTEXITCODE" }
          & openssl pkcs12 -export -out $pfxPath -inkey $keyPath -in $certPath -passout "pass:$pfxPass" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "openssl pkcs12 failed with exit code $LASTEXITCODE" }

          $secPass = ConvertTo-SecureString $pfxPass -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $secPass |
            Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $cert) { throw "Imported PFX does not contain a certificate with a private key" }

          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Created ephemeral CI code-signing certificate: $($cert.Subject) [$($cert.Thumbprint)]"

      - name: Build engine
        working-directory: aether
        run: cargo build --release

      - name: Sign and verify engine
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT"
          if (-not $cert) { throw "Code signing cert not found in store" }
          $enginePath = "aether/target/release/aether.exe"
          Set-AuthenticodeSignature -FilePath $enginePath -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null
          $sig = Get-AuthenticodeSignature -FilePath $enginePath
          if (-not $sig.SignerCertificate -or $sig.Status -in @("NotSigned", "HashMismatch")) { throw "Engine signature invalid: $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch "CN=deathline94(?:,|$)") { throw "Engine publisher CN mismatch: $($sig.SignerCertificate.Subject)" }
          Write-Host "Engine signed and verified successfully: $($sig.SignerCertificate.Subject)"

      - name: Stage engine
        shell: pwsh
        run: |
          $res = "apps/desktop/src-tauri/resources"
          New-Item -ItemType Directory -Force -Path $res | Out-Null
          Copy-Item -Force "aether/target/release/aether.exe" "$res/aether.exe"
          Copy-Item -Force "packaging/wintun.dll" "$res/wintun.dll"

      # The trust anchor has to be written between the engine build and the app
      # build: build.rs embeds it into the shell, so the shell ends up vouching
      # for the exact bytes this run produced and verified. It is still not the
      # same process as the comparison — hashing resources/aether.exe inside
      # build.rs made the runtime check structurally unable to fail.
      - name: Publish trust anchor for this run
        shell: pwsh
        run: |
          $eng = "apps/desktop/src-tauri/resources/aether.exe"
          $sig = Get-AuthenticodeSignature -FilePath $eng
          if ($sig.Status -ne "Valid") { throw "refusing to witness an engine whose signature is not Valid: $($sig.StatusMessage)" }
          if ($sig.SignerCertificate.Subject -notmatch "CN=deathline94(?:,|$)") { throw "refusing to witness an engine from the wrong publisher: $($sig.SignerCertificate.Subject)" }
          $certSha = (([Security.Cryptography.SHA256]::Create().ComputeHash($sig.SignerCertificate.RawData) | ForEach-Object { $_.ToString("x2") }) -join "")
          node scripts/publish-engine-trust.mjs --name aether.exe --file $eng --cert-sha $certSha --cn $sig.SignerCertificate.Subject
          node scripts/publish-engine-trust.mjs --name wintun.dll --file packaging/wintun.dll

      - name: Verify staged binaries against the trust anchor
        shell: pwsh
        run: |
          node scripts/publish-engine-trust.mjs --check --name aether.exe --file apps/desktop/src-tauri/resources/aether.exe
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file apps/desktop/src-tauri/resources/wintun.dll
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file packaging/wintun.dll

      - name: Build app
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm run tauri build

      - name: Sign and verify GUI and installer
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsis) { throw "installer missing" }

          $gui = @(
            "apps/desktop/src-tauri/target/release/Aether Next.exe",
            "apps/desktop/src-tauri/target/release/aether-desktop.exe",
            "apps/desktop/src-tauri/target/release/Aether.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gui) { throw "gui missing" }

          foreach ($bin in @($nsis.FullName, $gui)) {
            & ".github/scripts/sign-windows.ps1" -Thumbprint $env:WINDOWS_CERT_THUMBPRINT -Path $bin
            $sig = Get-AuthenticodeSignature -FilePath $bin
            if (-not $sig.SignerCertificate -or $sig.Status -in @("NotSigned", "HashMismatch")) { throw "Signature invalid for ${bin}: $($sig.StatusMessage)" }
            if ($sig.SignerCertificate.Subject -notmatch "CN=deathline94(?:,|$)") { throw "Publisher CN mismatch for ${bin}: $($sig.SignerCertificate.Subject)" }
            Write-Host "Verified signature for ${bin}: $($sig.SignerCertificate.Subject)"
          }

      - name: Package
        shell: pwsh
        run: |
          $out = "dist-windows"
          New-Item -ItemType Directory -Force -Path $out, "$out/portable/engine" | Out-Null
          $nsis = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsis) { throw "installer missing" }
          Copy-Item $nsis.FullName "$out/AetherNext-windows-x64-setup.exe"
          $gui = @(
            "apps/desktop/src-tauri/target/release/Aether Next.exe",
            "apps/desktop/src-tauri/target/release/aether-desktop.exe",
            "apps/desktop/src-tauri/target/release/Aether.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gui) { throw "gui missing" }
          Copy-Item $gui "$out/portable/AetherNext-Desktop.exe"
          Copy-Item "aether/target/release/aether.exe" "$out/portable/engine/aether.exe"
          Copy-Item "packaging/wintun.dll" "$out/portable/wintun.dll"
          Copy-Item "packaging/wintun.dll" "$out/portable/engine/wintun.dll"
          "Run AetherNext-Desktop.exe" | Set-Content "$out/portable/README.txt"
          # Ship the witness this build was compiled against: every digest the
          # running shell accepts, and the certificate it accepted, have to be
          # readable next to the binaries they describe.
          Copy-Item -Force "packaging/trust/engine-trust.json" "$out/portable/engine-trust.json"
          Copy-Item -Force "packaging/trust/engine-trust.json" "$out/engine-trust.json"
          Compress-Archive -Path "$out/portable/*" -DestinationPath "$out/AetherNext-portable-windows-x64.zip" -Force

      - name: Verify all packaged Windows binaries
        shell: pwsh
        run: |
          $bins = @(
            "dist-windows/AetherNext-windows-x64-setup.exe",
            "dist-windows/portable/AetherNext-Desktop.exe",
            "dist-windows/portable/engine/aether.exe"
          )
          foreach ($b in $bins) {
            $sig = Get-AuthenticodeSignature -FilePath $b
            if (-not $sig.SignerCertificate -or $sig.Status -in @("NotSigned", "HashMismatch")) { throw "Packaged artifact signature invalid for ${b}: $($sig.StatusMessage)" }
            if ($sig.SignerCertificate.Subject -notmatch "CN=deathline94(?:,|$)") { throw "Packaged artifact publisher mismatch for ${b}: $($sig.SignerCertificate.Subject)" }
            Write-Host "Verified packaged artifact $b : $($sig.SignerCertificate.Subject)"
          }
          # Same witness, later in the pipeline: nothing between staging and the
          # upload may move the bytes the shell was compiled to accept.
          node scripts/publish-engine-trust.mjs --check --name aether.exe --file dist-windows/portable/engine/aether.exe
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file dist-windows/portable/engine/wintun.dll
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file dist-windows/portable/wintun.dll

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows
          path: |
            dist-windows/AetherNext-windows-x64-setup.exe
            dist-windows/AetherNext-portable-windows-x64.zip
            dist-windows/engine-trust.json
          if-no-files-found: error

      - name: Remove signing key material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          @("aether-codesign.cnf", "aether-codesign.key", "aether-codesign.crt", "aether-codesign.pfx") |
            ForEach-Object {
              $path = Join-Path $env:RUNNER_TEMP $_
              if (Test-Path $path) { Remove-Item -LiteralPath $path -Force }
            }

  android-apk:
    name: Android APKs
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.22"
          cache: false
      - uses: lukka/get-cmake@5f6e04f5267c8133f1273bf2103583fc72c46b17 # v3.31.5
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - name: NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27d
          link-to-sdk: true
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Engine + stage
        working-directory: aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CMAKE_GENERATOR: Ninja
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cargo ndk -t "$abi" --platform 26 build --release
          done
          mkdir -p ../apps/android/android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          mkdir -p ../apps/android/android/app/src/main/assets/engine
          cp target/aarch64-linux-android/release/aether ../apps/android/android/app/src/main/jniLibs/arm64-v8a/libaether.so
          cp target/armv7-linux-androideabi/release/aether ../apps/android/android/app/src/main/jniLibs/armeabi-v7a/libaether.so
          cp target/x86_64-linux-android/release/aether ../apps/android/android/app/src/main/jniLibs/x86_64/libaether.so
          cp target/aarch64-linux-android/release/aether ../apps/android/android/app/src/main/assets/engine/aether
      - name: UI
        working-directory: apps/android
        run: |
          npm ci
          npm run sync-www
      - name: Verify staged native payloads
        working-directory: apps/android/android
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libaether.so libhev-socks5-tunnel.so; do
              f="app/src/main/jniLibs/$abi/$lib"
              test -s "$f"
              echo "ok $f $(stat -c%s "$f" 2>/dev/null || wc -c < "$f")"
            done
          done
      - name: APKs
        working-directory: apps/android/android
        env:
          AETHER_ANDROID_KEYSTORE: ${{ github.workspace }}/apps/android/android/release.keystore
          AETHER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=${{ steps.ndk.outputs.ndk-path }}" >> local.properties
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          ls -la app/build/outputs/apk/release/
      - name: Verify APK signature
        working-directory: apps/android/android
        run: |
          set -euo pipefail
          WANT="1396DD16D8F2954E7D9A213AD0BF2BA8B96E4A5B5F0A71C3CA88A133744794AC"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== verify $apk ==="
            out=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1) || {
              echo "$out"
              exit 1
            }
            echo "$out"
            # apksigner formats vary: "Signer #1 certificate SHA-256 digest:" or "V2 Signer: certificate SHA-256 digest:"
            digest=$(printf '%s\n' "$out" | grep -iE 'certificate SHA-256 digest:' | head -1 | sed -E 's/.*SHA-256 digest:[[:space:]]*//' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
            echo "signer digest=$digest"
            test -n "$digest"
            test "$digest" = "$WANT"
          done
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist-android
          rel=apps/android/android/app/build/outputs/apk/release
          cp "$rel"/app-arm64-v8a-release.apk    dist-android/AetherNext-android-arm64-v8a.apk
          cp "$rel"/app-armeabi-v7a-release.apk  dist-android/AetherNext-android-armeabi-v7a.apk
          cp "$rel"/app-x86_64-release.apk       dist-android/AetherNext-android-x86_64.apk
          cp "$rel"/app-universal-release.apk    dist-android/AetherNext-android-universal.apk
          ls -la dist-android/
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: android
          path: dist-android/*.apk
          if-no-files-found: error

  # Always refresh the GitHub Release so downloads stay in one place.
  # - push to main / manual → updates release "Latest" (tag: latest)
  # - push tag v1.2.3 → updates that versioned release
  publish:
    name: Publish downloads
    needs: [test, windows-app, android-apk]
    if: ${{ always() && needs.test.result == 'success' && needs.windows-app.result == 'success' && needs.android-apk.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist
          merge-multiple: true
      - name: Pack + checksums
        id: pack
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.apk' \) -exec cp -v {} out/ \;
          cd out
          ls -la
          for f in *; do
            [ -f "$f" ] || continue
            sha256sum "$f" | tee "$f.sha256"
          done
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Latest build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.pack.outputs.tag }}"
          TITLE="${{ steps.pack.outputs.title }}"
          PRE="${{ steps.pack.outputs.prerelease }}"
          NOTES="Windows installer + portable, Android APKs (arm64 / armv7 / x86_64 / universal).

          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Create or reuse release for this tag; move lightweight tag to this commit on main builds
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
            if [ "$PRE" = "true" ]; then gh release edit "$TAG" --prerelease; else gh release edit "$TAG" --latest; fi
          else
            EXTRA=()
            if [ "$PRE" = "true" ]; then EXTRA+=(--prerelease); else EXTRA+=(--latest); fi
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" "${EXTRA[@]}"
          fi

          # Overwrite files with the same names
          gh release upload "$TAG" out/* --clobber
