[package]
name = "aether"
version = "1.3.1"
edition = "2021"
rust-version = "1.88"

[dependencies]
quiche = { path = "../quiche/quiche", default-features = false, features = ["boringssl-boring-crate", "qlog"] }
boring = "4.22"
foreign-types-shared = "0.3"
libc = "0.2"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ring = "0.17"
octets = { path = "../quiche/octets" }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
futures = "0.3"
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
boringtun = "0.6"
x25519-dalek = "=2.0.0-rc.3"
blake2 = "0.11"
chacha20poly1305 = "0.10"
regex = "1"
ipnet = "2"
parking_lot = "0.12"
socket2 = "0.6.4"
h2 = "0.4"
http = "1"
bytes = "1"
tokio-boring = "4.22"
tokio-util = { version = "0.7", default-features = false }
zeroize = { version = "1", features = ["derive"] }
fs2 = "0.4"

[dev-dependencies]
# `internal` exposes quiche::test_utils::Pipe, an in-memory QUIC pair, so the
# transport tests can feed the tunnel loop hostile post-handshake packets,
# interim responses and off-stream headers deterministically.
#
# Dev-only on purpose: enabling it for the release build would ship quiche's
# test hooks. Test-only fixtures that cannot run against shipped code are one of
# the failure modes this feature exists to remove (see specs/015 research R42).
quiche = { path = "../quiche/quiche", default-features = false, features = [
  "boringssl-boring-crate",
  "qlog",
  "internal",
] }

[target.'cfg(windows)'.dependencies]
# `verify_binary_signature` makes `load_from_path` run WinVerifyTrust and check
# the signer name *before* LoadLibrary, so a tampered or substituted wintun.dll
# is refused without ever executing its DllMain.
wintun-bindings = { version = "0.7", features = ["verify_binary_signature"] }
# T039: `tun_win` installs, looks up and removes its owned routes through
# `netioapi` (`GetIpForwardTable2`/`CreateIpForwardEntry2`/`DeleteIpForwardEntry2`)
# instead of shelling out. These are the windows-sys modules those APIs and the
# `MIB_IPFORWARD_ROW2` layout live in — the crate's own generated bindings, not
# hand-written `#[link]` declarations, which have broken this binary before
# (0xc0000139). Feature-only change; windows-sys was already a dependency.
#
# Item 13 added the adapter half on the same three modules: the /32 address
# (`Set`/`GetUnicastIpAddressTable`+`DeleteUnicastIpAddressEntry`), the MTU and
# pinned metric (`Get`/`SetIpInterfaceEntry`) and the DNS server list
# (`Set`/`GetInterfaceDnsSettings`), all keyed to the interface LUID.
windows-sys = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[features]
# Compiles the ACL-injection hook `config::ACL_FAIL_FOR_TEST` so the
# fail-closed test can force an `icacls` failure. Off by default, so no shipped
# binary carries a switch that skips the private-file ACL.
test-hooks = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Load-bearing, not a preference: the netstack's `catch_unwind` containment
# around per-socket handling (R11) relies on a panic unwinding into that guard.
# `panic = "abort"` turns a single bad datagram into a whole-engine exit.
panic = "unwind"
strip = true
