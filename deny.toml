[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The vendored quiche fork is a path dependency, so it needs no git allowance —
# and it must not get one: an `allow-git` entry is how a vendor copy quietly
# turns into a live git dependency that nobody reviews.
allow-git = []

[licenses]
version = 2
# NOTE, verified against the cargo-deny docs: `copyleft` is a REMOVED key — "all
# licenses are denied unless explicitly allowed". Leaving a `copyleft = "warn"`
# line here would claim a knob that cannot move anything; the control that
# actually exists is this allow-list, so tightening means *removing an entry
# below*, and that is what "allowlist shrinkage requires human review" in
# spec.md §User Story 8 refers to.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OpenSSL",
  "CC0-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "AGPL-3.0-only",
]
