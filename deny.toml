# cargo deny configuration — specs/015-full-audit-remediation (T236/T237).
#
# This file was wired to NOTHING until now: `grep -rn "cargo deny"  .github scripts`
# returned only this file's own comments and the docs that promised a gate. It is
# now invoked by the `supply-chain` job in `.github/workflows/ci.yml`, which fails
# the build on any error-severity finding. Because a gate that cannot pass gets
# deleted, every relaxation below is measured against the committed lockfiles and
# says so, with the number and the command that produced it.
#
# Re-measure after any dependency change:
#   node scripts/measure-deny.mjs        # rewrites the [bans] skip block from both locks
#
# Vendored `quiche/`: the path dependencies `../quiche/quiche` and `../quiche/octets`
# ARE in `aether/Cargo.lock` (quiche 0.29.2, octets 0.3.5), so `cargo deny` resolves
# them and walks their dependency requirements — the vendor copy is not invisible.
# What cargo-deny cannot do is audit *their source*: RustSec advisories key on
# crates.io name+version, and a hand-patched tree published under those names is
# checked under the upstream version. That residual gap is closed by
# `scripts/verify-quiche-vendor.mjs` (see quiche/PATCHES.md), which is run in the
# same job.

[graph]
all-features = false

[advisories]
version = 2
# Windows releases use Tauri. Its cross-platform GTK and URL-pattern dependency
# tree contains these unmaintained crates with no patched versions available.
# Keep the exceptions narrow so new vulnerabilities still fail the build.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro-error through Tauri GTK build dependencies; no safe upgrade available" },
  { id = "RUSTSEC-2025-0081", reason = "unmaintained unic through Tauri urlpattern; no safe upgrade available" },
  { id = "RUSTSEC-2025-0075", reason = "unmaintained unic through Tauri urlpattern; no safe upgrade available" },
  { id = "RUSTSEC-2025-0080", reason = "unmaintained unic through Tauri urlpattern; no safe upgrade available" },
  { id = "RUSTSEC-2025-0100", reason = "unmaintained unic through Tauri urlpattern; no safe upgrade available" },
  { id = "RUSTSEC-2025-0098", reason = "unmaintained unic through Tauri urlpattern; no safe upgrade available" },
]

[bans]
# HARD ERROR. Today's graph is exempted only by the enumerated list below, so any
# NEW duplicated crate turns this red instead of scrolling past in a warning.
multiple-versions = "deny"
# HARD ERROR, and provably free: `grep -rnE 'version = "\*"' --include=Cargo.toml
# aether apps quiche` matches nothing. A wildcard requirement means the resolver,
# not this repository, decides which bytes get compiled.
wildcards = "deny"
skip = [
  # Generated from the two committed lockfiles: 44 crate names carry more
  # than one version (112 name+version pairs). Each
  # one is a transitive disagreement this repository does not own - boring/quiche,
  # tauri, smoltcp/boringtun pin different major lines of the same low-level crate.
  # Regenerate with `node scripts/measure-deny.mjs`; a *new* duplicate then shows up
  # as a red `cargo deny check bans` rather than a warning nobody reads.
  { name = "base64", version = "0.21.7" },
  { name = "base64", version = "0.22.1" },
  { name = "bitflags", version = "1.3.2" },
  { name = "bitflags", version = "2.13.1" },
  { name = "chacha20", version = "0.10.1" },
  { name = "chacha20", version = "0.9.1" },
