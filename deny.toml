# cargo deny configuration — specs/015-full-audit-remediation (T236/T237).
#
# The allow-lists below are deliberately permissive *today* and are expected to
# shrink: a gate that cannot pass is a gate that gets deleted. Every entry names
# why, so removal is a reviewable diff.

[graph]
all-features = false

[advisories]
version = 2
# RUSTSEC-2023-0071 is the `rsa` Marvin advisory, NOT a ring one. ring 0.16.20
# reaches this tree via boringtun 0.6.0 and is an EOL/duplicate-crate risk, not
# a known vulnerability; it is recorded here so the distinction survives.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "applies to rsa; we pull ring 0.16 transitively via boringtun (duplicate-crate risk, tracked)" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight-graph = false
skip = [
  # boring/quiche keep two copies of several low-level crates; resolving this is
  # a vendored-dependency decision, not a defect.
  { name = "windows-sys", version = "0.52" },
  { name = "windows-targets", version = "0.52" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The vendored quiche fork is a path dependency, so it needs no git allowance.
allow-git = []

[licenses]
version = 2
copyleft = "warn"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OpenSSL",
  "CC0-1.0",
]
